<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>gd-product-kit · 工作台样板</title>
<style>
:root{
  --bg:#f2f4f7; --panel:#ffffff; --panel2:#f8f9fb; --panel3:#eef1f5;
  --line:#e4e7ec; --line2:#d0d5dd;
  --text:#101828; --text2:#475467; --text3:#98a2b3;
  --brand:#4d6bfe; --brand-soft:#eef2ff; --brand-line:#c7d2fe;
  --green:#067647; --green-soft:#ecfdf3; --green-line:#abefc6;
  --amber:#b54708; --amber-soft:#fffaeb; --amber-line:#fedf89;
  --red:#b42318; --red-soft:#fef3f2; --red-line:#fecdca;
  --blue:#175cd3; --blue-soft:#eff8ff; --blue-line:#b2ddff;
  --purple:#6941c6; --purple-soft:#f4f3ff; --purple-line:#d9d6fe;
  --shadow:0 1px 2px rgba(16,24,40,.05);
  --shadow-lg:0 12px 32px rgba(16,24,40,.14);
  --mono:ui-monospace,"Cascadia Code","SFMono-Regular",Consolas,monospace;
  --mock-h:56px;
}
[data-theme="dark"]{
  --bg:#0f1115; --panel:#171a1f; --panel2:#1b1f26; --panel3:#222831;
  --line:#2a2f38; --line2:#3a404c;
  --text:#e6e8eb; --text2:#a8b0bd; --text3:#6f7885;
  --brand:#7c93ff; --brand-soft:#1d2440; --brand-line:#31408a;
  --green:#4ade80; --green-soft:#12261a; --green-line:#1f5133;
  --amber:#fbbf24; --amber-soft:#2a2312; --amber-line:#5c4a16;
  --red:#f87171; --red-soft:#2a1616; --red-line:#5c2626;
  --blue:#7dd3fc; --blue-soft:#0f2230; --blue-line:#1d4a63;
  --purple:#b69cff; --purple-soft:#211b38; --purple-line:#42366e;
  --shadow:0 1px 2px rgba(0,0,0,.4);
  --shadow-lg:0 12px 32px rgba(0,0,0,.5);
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;display:flex;flex-direction:column;height:100vh;overflow:hidden;
  background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  font-size:13px;-webkit-font-smoothing:antialiased;
}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input{font:inherit;color:inherit}
a{color:inherit}
code{font-family:var(--mono);font-size:.92em;background:var(--panel3);padding:1px 4px;border-radius:4px}
::selection{background:color-mix(in srgb,var(--brand) 22%,transparent)}
*{scrollbar-width:thin;scrollbar-color:var(--line2) transparent}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--line2);border-radius:8px;border:3px solid transparent;background-clip:padding-box}
svg{display:block;flex:none}

/* ---------- 样板控制条 ---------- */
.mockbar{
  height:var(--mock-h);flex:none;display:flex;align-items:center;gap:14px;
  padding:0 16px;background:#10141c;color:#e6e8eb;border-bottom:1px solid #1f2633;
  overflow-x:auto;white-space:nowrap;
}
.mb-left{display:flex;align-items:center;gap:10px;min-width:0}
.mb-badge{font-size:9px;font-weight:700;letter-spacing:.08em;padding:3px 6px;border-radius:5px;background:#2a3346;color:#9fb0ff}
.mb-left b{font-size:12.5px;font-weight:600}
.mb-note{font-size:11px;color:#7d8797}
.mb-right{margin-left:auto;display:flex;align-items:center;gap:8px}
.mb-label{font-size:11px;color:#7d8797}
.seg{display:flex;gap:2px;padding:2px;border-radius:8px;background:#1a2130;border:1px solid #2a3346}
.seg button{padding:4px 9px;border-radius:6px;font-size:11.5px;color:#9aa4b2;white-space:nowrap}
.seg button:hover{color:#fff}
.seg button.on{background:#2f3a52;color:#fff}
.mb-theme{height:28px;padding:0 10px;border-radius:7px;border:1px solid #2a3346;background:#1a2130;color:#c4cbd6;font-size:11.5px}
.mb-theme:hover{border-color:#3a4766;color:#fff}

/* ---------- 应用外壳 ---------- */
.app{flex:1;min-height:0;display:flex;background:var(--bg)}
.rail{
  width:60px;flex:none;background:var(--panel);border-right:1px solid var(--line);
  display:flex;flex-direction:column;align-items:center;padding:10px 0;gap:4px;
}
.logo{
  width:30px;height:30px;border-radius:9px;margin-bottom:10px;
  background:linear-gradient(135deg,#5b7cfa,#3f5be0);color:#fff;
  display:grid;place-items:center;font-size:10px;font-weight:800;letter-spacing:.02em;
}
.rail button{width:38px;height:38px;border-radius:10px;color:var(--text3);display:grid;place-items:center;position:relative}
.rail button:hover{background:var(--panel2);color:var(--text2)}
.rail button.on{background:var(--brand-soft);color:var(--brand)}
.rail button.on::before{content:"";position:absolute;left:-11px;top:9px;bottom:9px;width:2px;border-radius:2px;background:var(--brand)}
.rail-spacer{flex:1}

/* ---------- 工作台头部 ---------- */
.wb{flex:1;min-width:0;display:flex;flex-direction:column}
.wb-head{
  height:62px;flex:none;display:flex;align-items:center;gap:14px;padding:0 18px;
  background:var(--panel);border-bottom:1px solid var(--line);
}
.wb-title{display:flex;align-items:center;gap:10px;min-width:0}
.wb-ico{width:30px;height:30px;border-radius:8px;background:var(--brand-soft);color:var(--brand);display:grid;place-items:center}
.wb-t{font-size:13.5px;font-weight:650;line-height:1.2}
.wb-s{font-size:10.5px;color:var(--text3);margin-top:2px}
.search{
  margin-left:auto;display:flex;align-items:center;gap:7px;height:32px;width:280px;
  padding:0 10px;border:1px solid var(--line);border-radius:8px;background:var(--panel2);color:var(--text3);
}
.search:focus-within{border-color:var(--brand-line);background:var(--panel);box-shadow:0 0 0 3px var(--brand-soft)}
.search input{border:0;outline:0;background:none;width:100%;font-size:12px;color:var(--text)}
.search input::placeholder{color:var(--text3)}
.wb-actions{display:flex;align-items:center;gap:8px}

/* ---------- 通用控件 ---------- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;height:32px;padding:0 12px;
  border-radius:8px;border:1px solid var(--line2);background:var(--panel);color:var(--text2);
  font-size:12px;font-weight:500;white-space:nowrap;transition:background .12s,border-color .12s,color .12s;
}
.btn:hover{background:var(--panel2);color:var(--text)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.primary:hover{filter:brightness(1.06);color:#fff}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--panel2)}
.btn.sm{height:26px;padding:0 8px;font-size:11px;border-radius:6px}
.btn.icon{width:32px;padding:0}
.btn:disabled{opacity:.45;cursor:not-allowed}
.chip{
  display:inline-flex;align-items:center;gap:4px;height:22px;padding:0 8px;border-radius:999px;
  font-size:11px;line-height:1;font-weight:500;border:1px solid transparent;white-space:nowrap;
}
.chip.green{color:var(--green);background:var(--green-soft);border-color:var(--green-line)}
.chip.amber{color:var(--amber);background:var(--amber-soft);border-color:var(--amber-line)}
.chip.red{color:var(--red);background:var(--red-soft);border-color:var(--red-line)}
.chip.blue{color:var(--blue);background:var(--blue-soft);border-color:var(--blue-line)}
.chip.purple{color:var(--purple);background:var(--purple-soft);border-color:var(--purple-line)}
.chip.gray{color:var(--text2);background:var(--panel3);border-color:var(--line)}
.dot{width:7px;height:7px;border-radius:50%;flex:none;background:var(--text3)}
.dot.green{background:var(--green)}
.dot.amber{background:var(--amber)}
.dot.blue{background:var(--blue)}
.dot.gray{background:var(--text3)}

/* ---------- 左侧项目列表 ---------- */
.wb-body{flex:1;min-height:0;display:flex}
.plist{width:300px;flex:none;display:flex;flex-direction:column;background:var(--panel2);border-right:1px solid var(--line)}
.plist-head{padding:14px 12px 10px;display:flex;flex-direction:column;gap:10px}
.plist-title{font-size:12px;font-weight:650;color:var(--text2);display:flex;align-items:center;gap:6px}
.plist-title span{font-weight:500;color:var(--text3);font-size:11px}
.filters{display:flex;gap:4px;flex-wrap:wrap}
.filters button{
  height:24px;padding:0 8px;border-radius:6px;border:1px solid transparent;
  font-size:11px;color:var(--text3);display:inline-flex;align-items:center;gap:4px;
}
.filters button:hover{color:var(--text2);background:var(--panel3)}
.filters button.on{color:var(--brand);background:var(--brand-soft);border-color:var(--brand-line)}
.filters em{font-style:normal;font-size:10px;opacity:.75}
.plist-scroll{flex:1;overflow:auto;padding:2px 8px 14px}
.prow{
  width:100%;text-align:left;display:flex;flex-direction:column;gap:7px;
  padding:10px 11px;border-radius:10px;border:1px solid transparent;margin-bottom:4px;
  transition:background .12s,border-color .12s;
}
.prow:hover{background:color-mix(in srgb,var(--panel) 72%,transparent)}
.prow.on{background:var(--panel);border-color:var(--line2);box-shadow:var(--shadow)}
.prow.paused{opacity:.66}
.prow-top{display:flex;align-items:center;gap:7px;min-width:0}
.prow-name{flex:1;min-width:0;font-size:12.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prow-ver{font-family:var(--mono);font-size:10px;color:var(--text3);border:1px solid var(--line);border-radius:5px;padding:1px 4px;background:var(--panel)}
.prow-sub{display:flex;align-items:center;gap:7px;font-size:10.5px;color:var(--text3);min-width:0}
.prow-sub .chip{height:19px;font-size:10px;padding:0 6px}
.prow-time{margin-left:auto;white-space:nowrap}
.pbar{height:3px;border-radius:2px;background:var(--line);overflow:hidden}
.pbar i{display:block;height:100%;background:var(--brand);border-radius:2px}
.pbar.paused i{background:var(--text3)}
.plist-empty{padding:32px 12px;text-align:center;font-size:11.5px;color:var(--text3)}
.plist-foot{
  flex:none;padding:9px 12px;border-top:1px solid var(--line);font-size:10px;color:var(--text3);
  display:flex;align-items:center;gap:6px;font-family:var(--mono);
}
.plist-foot button{margin-left:auto;font-size:10.5px;color:var(--brand);font-family:inherit}

/* ---------- 详情 ---------- */
.detail{flex:1;min-width:0;overflow:auto}
.detail-inner{max-width:1200px;margin:0 auto;padding:22px 26px 64px}
.dhead{display:flex;align-items:flex-start;gap:14px;margin-bottom:16px}
.dhead h1{font-size:20px;font-weight:700;margin:0;letter-spacing:-.01em;line-height:1.25}
.dhead .kind{margin-left:8px;vertical-align:2px}
.path{font-family:var(--mono);font-size:10.5px;color:var(--text3);margin-top:4px}
.dhead-right{margin-left:auto;display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.ver{font-family:var(--mono);font-size:11.5px;padding:3px 7px;border:1px solid var(--line2);border-radius:6px;color:var(--text2);background:var(--panel)}
.cols{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:16px;align-items:start}
@media (max-width:1180px){.cols{grid-template-columns:1fr}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;box-shadow:var(--shadow)}
.main>.card,.side>.card{margin-bottom:14px}
.card-head{display:flex;align-items:center;gap:8px;margin-bottom:12px;min-height:24px}
.card-head h2{font-size:12.5px;font-weight:650;margin:0}
.card-head .hint{font-size:10.5px;color:var(--text3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card-head .act{margin-left:auto;display:flex;gap:6px;flex:none}

/* 版本卡 */
.vgoal{font-size:15px;font-weight:600;line-height:1.5;margin:0 0 12px}
.vmeta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:11px;color:var(--text3)}
.release{
  display:flex;align-items:center;gap:8px;margin-top:12px;padding:9px 11px;
  border:1px dashed var(--line2);border-radius:9px;font-size:11.5px;color:var(--text3);
}
.release a{color:var(--brand);text-decoration:none;font-family:var(--mono);font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.release a:hover{text-decoration:underline}
.release .grow{flex:1;min-width:0}
.track{display:flex;margin:18px 0 4px}
.tstep{flex:1;position:relative;text-align:center;font-size:10.5px;color:var(--text3);min-width:0}
.tstep::before{content:"";position:absolute;top:5px;left:-50%;width:100%;height:2px;background:var(--line);z-index:0}
.tstep:first-child::before{display:none}
.tstep.done::before{background:var(--brand-line)}
.tstep.active::before{background:var(--brand-line)}
.tstep .tdot{
  width:10px;height:10px;border-radius:50%;display:block;margin:0 auto 6px;position:relative;z-index:1;
  background:var(--line2);border:2px solid var(--panel);box-sizing:content-box;
}
.tstep.done .tdot{background:var(--brand)}
.tstep.active .tdot{background:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
.tstep b{display:block;font-size:10.5px;font-weight:600;color:var(--text2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tstep.done b{color:var(--text2)}
.tstep.active b{color:var(--brand)}
.tstep span{display:block;font-size:9.5px;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vline{display:flex;align-items:center;gap:9px;margin:2px 0 4px}
.vline .ver{font-size:13px;padding:3px 8px}
.vempty{font-size:11px;color:var(--text3);padding:9px 0 2px}
.nextline{display:flex;align-items:baseline;gap:8px;margin-top:14px;padding-top:12px;border-top:1px solid var(--line);font-size:11.5px;min-width:0}
.nextline span{color:var(--text3);flex:none}
.nextline b{font-weight:550;color:var(--text2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dsub{margin-top:5px;display:flex;align-items:center;gap:5px;font-size:10.5px;color:var(--text3);min-width:0}
.dsub a{color:var(--brand);text-decoration:none;font-family:var(--mono);font-size:10.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dsub a:hover{text-decoration:underline}
.dsub .bad{color:var(--red)}
.vsub{font-size:10.5px;font-weight:600;color:var(--text3);margin:16px 0 6px;letter-spacing:.02em}
ul.no{margin:0;padding-left:16px;color:var(--text3);font-size:11.5px;line-height:1.8}
ul.no li{text-decoration:line-through;text-decoration-color:var(--line2)}

/* 六件套 */
.arts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 22px}
.art{
  display:flex;align-items:center;justify-content:space-between;gap:10px;min-width:0;
  padding:10px 4px;border-bottom:1px solid var(--line);text-align:left;
  background:none;border-radius:0;transition:background .12s;
}
.art:hover{background:var(--panel2)}
.arts .art:nth-last-child(-n+2){border-bottom:0}
.art-name{font-size:12.5px;font-weight:550;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.art-fmts{display:flex;align-items:center;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.fmt{font-size:9.5px;font-weight:600;letter-spacing:.02em;white-space:nowrap}
.fmt.on{color:var(--green);background:var(--green-soft);border:1px solid var(--green-line);border-radius:4px;padding:1px 5px}
.fmt.miss{color:var(--text3);font-weight:400;font-size:10px}

/* 待办 / 点子 */
.todo{display:flex;flex-direction:column;gap:6px;padding:9px 0;border-top:1px solid var(--line)}
.todo:first-of-type{border-top:0;padding-top:0}
.todo-top{display:flex;align-items:center;gap:6px;min-width:0}
.todo-title{font-size:12px;font-weight:550;line-height:1.4;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.todo-bot{display:flex;align-items:center;gap:8px;min-width:0;padding-left:1px}
.todo-bot .btn{margin-left:auto;flex:none}
.doclink{
  display:inline-flex;align-items:center;gap:3px;font-size:10.5px;color:var(--brand);
  text-decoration:none;width:fit-content;
}
.doclink:hover{text-decoration:underline}
.todo.blocked{background:var(--amber-soft);border-radius:8px;padding:9px 10px;margin:6px -10px 0;border-top-color:transparent}
.todo.blocked+.todo{border-top-color:transparent}
.idea{display:flex;align-items:flex-start;gap:9px;padding:9px 0;border-top:1px solid var(--line)}
.idea:first-of-type{border-top:0;padding-top:0}
.idea .num{font-family:var(--mono);font-size:10px;color:var(--text3);border:1px solid var(--line);border-radius:5px;padding:1px 4px;margin-top:1px;background:var(--panel2)}
.idea-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.idea-title{font-size:12.5px;font-weight:550}
.idea-desc{font-size:10.5px;color:var(--text3);line-height:1.4}
.idea .chip{height:19px;font-size:10px;padding:0 6px;margin-top:1px}
.idea-actions{display:flex;align-items:center;gap:8px;flex:none}
.empty-note{padding:14px 2px;font-size:11.5px;color:var(--text3);display:flex;align-items:center;gap:6px}

/* 右栏 */
.side .card{padding:14px}
.side-list{display:flex;flex-direction:column;gap:9px}
.side-row{display:flex;align-items:flex-start;gap:7px;font-size:11.5px;color:var(--text2);line-height:1.4;min-width:0}
.side-row .hash{font-family:var(--mono);font-size:10px;color:var(--text3);flex:none;padding-top:1px}
.side-row .msg{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.side-row .t{flex:none;font-size:10px;color:var(--text3)}
.side-row .chip{height:19px;font-size:10px;padding:0 6px;flex:none}
.health{display:flex;flex-direction:column;gap:8px}
.health-row{display:flex;align-items:center;gap:7px;font-size:11.5px;color:var(--text2)}
.hdot{width:6px;height:6px;border-radius:50%;background:var(--line2);flex:none}
.hdot.ok{background:var(--green)}
.hdot.bad{background:var(--red)}
.health-row .val{margin-left:auto;font-size:10.5px;color:var(--text3);font-family:var(--mono)}
.data-foot{
  margin-top:12px;padding-top:10px;border-top:1px solid var(--line);
  display:flex;align-items:center;gap:6px;font-size:10.5px;color:var(--text3);
}
.data-foot button{margin-left:auto;color:var(--brand);font-size:10.5px}
.dyn{display:flex;flex-direction:column;gap:6px}
.dyn-label{font-size:9.5px;font-weight:600;color:var(--text3);letter-spacing:.04em;margin-top:6px}
.dyn-label:first-child{margin-top:0}
.dyn .side-row{font-size:11px}
.dyn .side-row .hash{font-size:9.5px}
.dyn .muted{font-size:10.5px;color:var(--text3)}

/* Banner */
.banner{
  display:flex;align-items:center;gap:9px;padding:10px 13px;border-radius:10px;
  border:1px solid;font-size:11.5px;margin-bottom:16px;line-height:1.4;
}
.banner .b-msg{flex:1;min-width:0}
.banner .b-act{flex:none}
.banner.amber{background:var(--amber-soft);border-color:var(--amber-line);color:var(--amber)}
.banner.red{background:var(--red-soft);border-color:var(--red-line);color:var(--red)}
.banner.blue{background:var(--blue-soft);border-color:var(--blue-line);color:var(--blue)}
.banner.gray{background:var(--panel3);border-color:var(--line2);color:var(--text2)}

/* 空态 */
.empty-wrap{display:flex;align-items:center;justify-content:center;min-height:70vh}
.empty{max-width:420px;text-align:center;padding:24px}
.empty h2{font-size:17px;margin:14px 0 6px}
.empty p{font-size:12px;color:var(--text3);line-height:1.7;margin:0 0 16px}
.empty-actions{display:flex;gap:8px;justify-content:center;margin-bottom:14px}
.empty-hint{
  display:inline-flex;align-items:center;gap:6px;padding:8px 11px;border-radius:8px;
  background:var(--panel2);border:1px dashed var(--line2);font-size:10.5px;color:var(--text3);
}
.empty-ill{width:132px;height:96px;margin:0 auto;border:1px solid var(--line2);border-radius:12px;background:var(--panel);padding:14px}
.empty-ill i{display:block;height:7px;border-radius:4px;background:var(--panel3);margin-bottom:7px}
.empty-ill i:nth-child(1){width:42%;background:var(--brand-soft)}
.empty-ill i:nth-child(2){width:88%}
.empty-ill i:nth-child(3){width:70%}
.empty-ill i:nth-child(4){width:52%;height:24px;margin-top:12px;background:var(--panel3)}

/* ---------- 新建向导 ---------- */
.modal{position:fixed;inset:0;z-index:80;display:none;align-items:center;justify-content:center;padding:24px;background:rgba(16,24,40,.46)}
.modal.on{display:flex}
.modal-card{
  width:760px;max-width:100%;max-height:92vh;display:flex;flex-direction:column;overflow:hidden;
  background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow-lg);
}
.wiz-head{display:flex;align-items:flex-start;gap:12px;padding:18px 20px 12px}
.wiz-kicker{font-size:9.5px;font-weight:700;letter-spacing:.08em;color:var(--brand);text-transform:uppercase}
.wiz-head h2{font-size:17px;font-weight:700;margin:3px 0 0;letter-spacing:-.01em}
.wiz-head .close{margin-left:auto;width:30px;height:30px;border-radius:8px;color:var(--text3);display:grid;place-items:center;font-size:18px;line-height:1}
.wiz-head .close:hover{background:var(--panel2);color:var(--text)}
.wiz-steps{display:flex;align-items:center;justify-content:flex-start;gap:8px;padding:0 20px 14px;border-bottom:1px solid var(--line)}
.wstep{display:flex;align-items:center;gap:6px;font-size:10.5px;color:var(--text3);white-space:nowrap}
.wstep i{width:17px;height:17px;border-radius:50%;border:1px solid var(--line2);display:grid;place-items:center;font-style:normal;font-size:9px;font-weight:700;background:var(--panel)}
.wstep.on{color:var(--brand);font-weight:600}
.wstep.on i{background:var(--brand);border-color:var(--brand);color:#fff}
.wstep.done i{background:var(--green-soft);border-color:var(--green-line);color:var(--green)}
.wline{flex:0 0 34px;height:1px;background:var(--line)}
.wiz-body{flex:1;overflow:auto;padding:17px 20px 8px}
.wiz-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.field{margin-bottom:12px;min-width:0}
.field label{display:flex;align-items:center;gap:5px;font-size:11px;font-weight:600;color:var(--text2);margin-bottom:5px}
.field .req{color:var(--red);font-weight:700}
.field input,.field textarea{
  width:100%;border:1px solid var(--line);border-radius:8px;background:var(--panel2);
  color:var(--text);padding:8px 10px;font:inherit;font-size:12px;outline:0;resize:vertical;
}
.field input:focus,.field textarea:focus{border-color:var(--brand);background:var(--panel);box-shadow:0 0 0 3px var(--brand-soft)}
.field textarea{min-height:64px;line-height:1.55}
.field .hint{font-size:10px;color:var(--text3);margin-top:4px;line-height:1.5}
.typechips{display:flex;gap:5px;flex-wrap:wrap;padding-top:1px}
.typechips button{height:28px;padding:0 9px;border:1px solid var(--line);border-radius:7px;font-size:11px;color:var(--text2);background:var(--panel)}
.typechips button.on{border-color:var(--brand);background:var(--brand-soft);color:var(--brand);font-weight:600}
.dirrow{display:flex;gap:6px}
.dirrow input{flex:1;min-width:0}
.wiz-note{display:flex;gap:8px;padding:9px 11px;border:1px dashed var(--line2);border-radius:8px;font-size:10.5px;color:var(--text3);line-height:1.55;margin-bottom:13px}
.wiz-note svg{flex:none;margin-top:1px}
.genbox{border:1px solid var(--line);border-radius:10px;background:var(--panel2);padding:12px 14px;margin-top:4px}
.gen-title{font-size:11px;font-weight:600;color:var(--text2);margin-bottom:6px}
.genbox ul{margin:0;padding-left:16px;font-size:11px;color:var(--text2);line-height:1.8}
.genbox .hint{font-size:10px;color:var(--text3);margin-top:6px;line-height:1.5}
.wiz-foot{display:flex;align-items:center;gap:8px;padding:12px 20px;border-top:1px solid var(--line);background:var(--panel2)}
.wiz-foot .spacer{flex:1}

/* ---------- 侧栏抽屉 ---------- */
.drawer{
  position:fixed;top:var(--mock-h);right:0;bottom:0;width:480px;z-index:60;
  display:flex;flex-direction:column;background:var(--panel);border-left:1px solid var(--line);
  box-shadow:var(--shadow-lg);transform:translateX(102%);transition:transform .22s ease;
}
.drawer.on{transform:none}
.dhead2{flex:none;display:flex;align-items:flex-start;gap:10px;padding:14px 16px 12px;border-bottom:1px solid var(--line)}
.dhead2 .ico{width:30px;height:30px;border-radius:8px;background:var(--brand-soft);color:var(--brand);display:grid;place-items:center;flex:none}
.dhead2 h3{margin:0;font-size:13px;font-weight:650}
.dhead2 .dpath{font-family:var(--mono);font-size:10px;color:var(--text3);margin-top:3px;word-break:break-all}
.dhead2 .close{margin-left:auto;flex:none;width:28px;height:28px;border-radius:7px;color:var(--text3);display:grid;place-items:center}
.dhead2 .close:hover{background:var(--panel2);color:var(--text)}
.dtabs{flex:none;display:flex;gap:4px;padding:10px 16px 0;border-bottom:1px solid var(--line)}
.dtab{height:30px;padding:0 10px;border-radius:7px 7px 0 0;font-size:11.5px;color:var(--text3);border-bottom:2px solid transparent}
.dtab:hover{color:var(--text2)}
.dtab.on{color:var(--brand);border-bottom-color:var(--brand);font-weight:600}
.dbody{flex:1;overflow:auto;padding:18px 20px 26px}
.dfoot{flex:none;display:flex;align-items:center;gap:8px;padding:11px 16px;border-top:1px solid var(--line);background:var(--panel2)}
.dfoot .spacer{flex:1}
.dnote{font-size:10px;color:var(--text3);padding:0 20px 12px}

/* 文档内容 */
.doc{color:var(--text2);font-size:12.5px;line-height:1.75}
.doc-kicker{font-size:10px;font-weight:600;letter-spacing:.05em;color:var(--brand);text-transform:uppercase;margin-bottom:6px}
.doc h1{font-size:19px;line-height:1.3;margin:0 0 8px;color:var(--text);letter-spacing:-.01em}
.doc .doc-lead{font-size:13px;color:var(--text2);margin:0 0 4px}
.doc h2{font-size:12.5px;margin:20px 0 8px;padding-top:12px;border-top:1px solid var(--line);color:var(--text)}
.doc p{margin:0 0 9px}
.doc ul{margin:0 0 10px;padding-left:18px}
.doc li{margin:3px 0}
.doc blockquote{
  margin:10px 0 14px;padding:10px 12px;border-left:3px solid var(--brand);

.doc table{width:100%;border-collapse:collapse;font-size:11.5px;margin:6px 0 12px}
.doc th,.doc td{border:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
.doc th{background:var(--panel2);color:var(--text3);font-weight:600}
.doc a{color:var(--brand);text-decoration:none}
.doc code{font-size:11px}
.doc pre.code{margin:6px 0 12px;padding:9px 11px;background:var(--panel2);border:1px solid var(--line);border-radius:8px;font-family:var(--mono);font-size:11px;color:var(--text2);overflow:auto}
.doc .muted{color:var(--text3);font-size:11px}
.swatches{display:flex;gap:7px;margin:4px 0 10px}
.swatches span{width:34px;height:34px;border-radius:8px;border:1px solid rgba(0,0,0,.08)}
.wf{display:flex;gap:16px;flex-wrap:wrap;margin:8px 0 10px}
.wf-phone{width:178px;border:1px solid var(--line2);border-radius:16px;padding:9px;background:var(--panel2)}
.wf-bar{height:13px;border-radius:7px;background:var(--line);margin-bottom:8px}
.wf-block{border-radius:5px;background:color-mix(in srgb,var(--line) 72%,transparent);margin-bottom:7px}
.md{
  margin:0;padding:14px;border:1px solid var(--line);border-radius:10px;background:var(--panel2);

.drawer-empty{text-align:center;padding:36px 20px;color:var(--text3)}
.drawer-empty h4{margin:12px 0 6px;font-size:13px;color:var(--text2)}
.drawer-empty p{font-size:11.5px;line-height:1.6;margin:0 auto 16px;max-width:300px}
.toast{
  position:fixed;left:50%;bottom:26px;z-index:100;transform:translate(-50%,14px);

@media (max-width:1080px){

const STATE_LABEL = {doing:'进行中', todo:'待做', blocked:'卡点'};
const STATE_TONE  = {doing:'blue', todo:'gray', blocked:'amber'};

const state = {
  scenario:'normal',
  selected:'pbsk',
  filter:'all',
  q:'',
  drawer:null,
  theme:'light'
};

/* ------------------------------ 数据视图 ------------------------------ */
function projectById(id){ return PROJECTS.find(p=>p.id===id) || null; }

function viewProject(p){
  if(!p) return null;
  const v = {
    ...p,
    version:{...p.version, track:(p.version.track||[]).map(s=>({...s})), notDoing:[...(p.version.notDoing||[])]},
    release:p.release ? {...p.release} : null,
    artifacts:{...p.artifacts}
  };
  if(state.scenario==='stale' && p.id==='catalk'){ v.updated='9 天前'; v.stale=true; }
  if(state.scenario==='dead' && p.id==='gds'){ v.release = {...v.release, probe:'fail'}; v.dead=true; }
  return v;
}

function counts(){
  const live = PROJECTS.filter(p=>!p.archived);
  return {
    all: live.length,
    active: live.filter(p=>!p.version.state.includes('暂停')).length,
    paused: live.filter(p=>p.version.state.includes('暂停')).length,
    archived: PROJECTS.filter(p=>p.archived).length
  };
}

function visibleProjects(){
  if(state.scenario==='empty') return [];
  let list = PROJECTS.filter(p=>{
    if(state.filter==='archived') return p.archived;
    if(p.archived) return false;
    if(state.filter==='paused') return p.version.state.includes('暂停');
    if(state.filter==='active') return !p.version.state.includes('暂停');
    return true;
  });
  const q = state.q.trim().toLowerCase();
  if(q) list = list.filter(p=>p.name.toLowerCase().includes(q));
  return list;
}

/* ------------------------------ 渲染：项目列表 ------------------------------ */
function renderList(){
  const host = document.getElementById('plist');
  if(state.scenario==='empty'){
    host.innerHTML = `
      <div class="plist-head">
        <div class="plist-title">项目 <span>0</span></div>
        <div class="filters">
          <button class="on">全部 <em>0</em></button>
          <button>进行中 <em>0</em></button>
          <button>暂停 <em>0</em></button>
          <button>已归档 <em>0</em></button>
        </div>
      </div>
      <div class="plist-empty">还没有项目<br><br>从「导入项目」开始，<br>先映射铺板快算。</div>
      <div class="plist-foot">扫描：E:\\AI · E:\\WORK <button data-action="toast" data-msg="真实插件：重新扫描配置的根目录（示意）">重新扫描</button></div>
    `;
    return;
  }
  const c = counts();
  const list = visibleProjects();
  const chips = [
    ['all','全部',c.all],
    ['active','进行中',c.active],
    ['paused','暂停',c.paused],
    ['archived','已归档',c.archived]
  ].map(([f,label,n])=>`<button class="${state.filter===f?'on':''}" data-action="filter" data-filter="${f}">${label} <em>${n}</em></button>`).join('');

  host.innerHTML = `
    <div class="plist-head">
      <div class="plist-title">项目 <span>${c.all}</span></div>
      <div class="filters">${chips}</div>
    </div>
    <div class="plist-scroll">
      ${list.length ? list.map(projectRow).join('') : '<div class="plist-empty">没有匹配的项目</div>'}
    </div>
    <div class="plist-foot">扫描：E:\\AI · E:\\WORK <button data-action="toast" data-msg="真实插件：重新扫描配置的根目录（示意）">重新扫描</button></div>
  `;
}

function projectRow(p){
  const v = viewProject(p);
  const job = v.version;
  const todos = v.todos.filter(t=>t.state!=='done').length;
  const blocked = v.todos.filter(t=>t.state==='blocked').length;
  const steps = job.track || [];
  const done = steps.filter(s=>s.s==='done').length;
  const active = steps.filter(s=>s.s==='active').length;
  const pct = steps.length ? Math.round(((done + active*0.5) / steps.length) * 100) : 0;
  const bar = steps.length
    ? `<div class="pbar ${job.state.includes('暂停')||p.archived?'paused':''}"><i style="width:${pct}%"></i></div>`
    : '';
  const dotTone = job.tone === 'amber' ? 'amber' : job.tone === 'blue' ? 'blue' : job.tone === 'green' ? 'green' : 'gray';
  return `<button class="prow ${state.selected===p.id?'on':''} ${job.state.includes('暂停')?'paused':''}" data-action="select" data-id="${p.id}">
    <div class="prow-top">
      <span class="dot ${dotTone}"></span>
      <span class="prow-name">${p.name}</span>
      <span class="prow-ver">${job.label}</span>
    </div>
    <div class="prow-sub">
      <span class="chip ${job.tone}">${job.state}</span>
      <span>待办 ${todos}${blocked?` · 卡点 ${blocked}`:''}</span>
      <span class="prow-time">${v.updated}</span>
    </div>
    ${bar}
  </button>`;
}

/* ------------------------------ 渲染：详情 ------------------------------ */
function renderDetail(){
  const host = document.getElementById('detail');
  if(state.scenario==='empty'){ host.innerHTML = emptyDetail(); return; }
  const p = viewProject(projectById(state.selected));
  if(!p){ host.innerHTML = emptyDetail(); return; }

  host.innerHTML = `
    <div class="detail-inner">
      ${banner(p)}
      <div class="dhead">
        <div>
          <h1>${p.name}<span class="kind"><span class="chip gray">${p.kind}</span></span></h1>
          <div class="path">${p.path}</div>
          <div class="dsub">${releaseLine(p)}</div>
        </div>
        <div class="dhead-right">
          ${p.archived ? '' : `<button class="btn primary" data-action="toast" data-msg="真实插件：在该项目工作区打开新会话，并带上版本目标与下一步（示意）">${p.version.state.includes('暂停')?'恢复并继续':'▶ 继续做'}</button>`}
          <button class="btn icon" aria-label="更多" data-action="toast" data-msg="更多操作：打开目录 / 编辑 project.json / 归档（示意）">···</button>
        </div>
      </div>
      <div class="cols">
        <div class="main">
          ${versionCard(p)}
          ${artifactsCard(p)}
          ${ideasCard(p)}
        </div>
        <aside class="side">
          ${todosCard(p)}
          ${healthCard(p)}
          ${dynamicsCard(p)}
        </aside>
      </div>
    </div>
  `;
}

function banner(p){
  if(p.archived){
    return bannerEl('gray','已归档，只读。取消归档后才能继续更新。','取消归档','toast','真实插件：取消归档（示意）');
  }
  if(p.version.state.includes('暂停')){
    return bannerEl('gray','已暂停 21 天。恢复时从「下一步」继续，六件套不会丢。','恢复项目','toast','真实插件：恢复项目（示意）');
  }
  if(state.scenario==='stale' && p.id==='catalk'){
    return bannerEl('amber','project.json 9 天没更新，下面的状态可能已经过期。','让 AI 回顾最近提交','toast','真实插件：派发「读 git log + 最近会话，更新 project.json」（示意）');
  }
  if(state.scenario==='dead' && p.id==='gds'){
    return bannerEl('red','发布地址打不开：https://gaodingpm.com（1 小时前检测，超时）。','重新检测','toast','真实插件：重新探测发布地址（示意）');
  }
  if(state.scenario==='new' && p.id==='catalk'){
    return bannerEl('blue','刚创建 3 天 · 六件套 3/6。先把需求补齐，再开第一个会话。','铺模板','toast','真实插件：把缺失的六件套模板铺进项目目录（示意）');
  }
  return '';
}

function bannerEl(tone, text, actLabel, action, toastMsg){

  </div>`;
}

/* ------------------------------ 渲染：抽屉 ------------------------------ */
function renderDrawer(){
  const host = document.getElementById('drawer');
  const d = state.drawer;
  if(!d){ host.classList.remove('on'); host.innerHTML=''; return; }
  host.classList.add('on');

  if(d.kind==='doc'){
    const doc = DOCS[d.doc];
    if(!doc) return;
    host.innerHTML = `
      ${drawerHead('doc', doc.title, doc.path)}
      <div class="dbody"><pre class="md">${esc(doc.md)}</pre></div>
      ${drawerFoot(doc.path)}
    `;
    return;
  }

  const p = projectById(d.id);
  const meta = ART_META[d.key];
  const a = p?.artifacts?.[d.key] || {};
  const content = ART_CONTENT[d.key] || {md:'', html:null};
  const tab = state.drawer.tab || (a.html ? 'html' : 'md');
  const path = `docs/${meta.file}.${tab==='html'?'html':'md'}`;
  let body = '';
  const ro = !!p?.archived;
  if(!a.md && !a.html){
    body = `<div class="drawer-empty">
      ${icon('plus',22)}
      <h4>这份还没有生成</h4>
      <p>真实插件会把模板路径、当前版本目标一起写进 prompt，派给会话生成 MD 和 HTML 两份。</p>
      ${ro ? '<span class="chip gray">已归档 · 只读</span>' : `<button class="btn primary" data-action="toast" data-msg="真实插件：派发「按模板生成 ${meta.title}（MD + HTML）」（示意）">让 AI 生成${meta.title}</button>`}
    </div>`;
  }else if(tab==='html'){
    body = a.html ? content.html : `<div class="drawer-empty">
      ${icon('alert',22)}
      <h4>还没有 HTML 阅读版</h4>
      <p>MD 已经在了。真实插件会按 <code>templates/artifact.html</code> 补一份 HTML，内容以 MD 为准。</p>
      ${ro ? '<span class="chip gray">已归档 · 只读</span>' : `<button class="btn primary" data-action="toast" data-msg="真实插件：派发「把 ${meta.file}.md 渲染成 HTML 阅读版」（示意）">生成 HTML</button>`}
    </div>`;
  }else{
    body = `<pre class="md">${esc(content.md)}</pre>`;
  }

  host.innerHTML = `
    ${drawerHead('artifact', meta.title, path)}
    ${p.id!=='pbsk' ? '<div class="dnote">状态示意：文档内容只填了「铺板快算」的样例。</div>' : ''}
    <div class="dtabs">
      <button class="dtab ${tab==='html'?'on':''}" data-action="tab" data-tab="html">HTML 阅读版</button>
      <button class="dtab ${tab==='md'?'on':''}" data-action="tab" data-tab="md">MD 源文</button>
    </div>
    <div class="dbody">${body}</div>
    <div class="dnote">真实插件里，点卡片会调用 DSH 右侧栏打开这两份文件；这里用抽屉模拟。</div>
    ${drawerFoot(path)}
  `;
}

function drawerHead(kind, title, path){
  return `<div class="dhead2">
    <span class="ico">${icon(kind==='artifact'?'doc':'link',15)}</span>
    <div>
      <h3>${title}</h3>
      <div class="dpath">${path}</div>
    </div>
    <button class="close" aria-label="关闭" data-action="close-drawer">${icon('x',15)}</button>
  </div>`;
}

function drawerFoot(path){
  return `<div class="dnote">侧边栏预览 · 只读示意</div>
  <div class="dfoot">
    <button class="btn primary" data-action="toast" data-msg="真实插件：调用 sidebarRight.openResource 在侧栏打开 ${path}（示意）">在侧边栏打开</button>
    <button class="btn ghost" data-action="toast" data-msg="真实插件：复制 ${path}（示意）">复制路径</button>
    <span class="spacer"></span>
    <span class="chip gray">${path.endsWith('.html')?'HTML':'MD'}</span>

/* ------------------------------ 交互 ------------------------------ */
function setScenario(name){
  state.scenario = name;
  state.filter = 'all';
  state.q = '';
  state.drawer = null;
  document.getElementById('q').value = '';
  if(name==='empty') state.selected = null;
  else if(name==='new' || name==='stale') state.selected='catalk';
  else if(name==='dead') state.selected='gds';
  else if(name==='paused') state.selected='plant';
  else state.selected='pbsk';
  renderAll();
}

function updateScenarioButtons(){
  document.querySelectorAll('#scenarios button').forEach(b=>{
    b.classList.toggle('on', b.dataset.scenario===state.scenario);
  });
}

function updateThemeButton(){
  document.getElementById('themeBtn').textContent = state.theme==='light' ? '深色' : '浅色';
}

function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('on');
  clearTimeout(toast._t);
  toast._t = setTimeout(()=>t.classList.remove('on'), 2200);
}

function openArtifact(id, key){
  state.drawer = {kind:'artifact', id, key, tab: (projectById(id)?.artifacts?.[key]?.html ? 'html' : 'md')};
  renderDrawer();
}

function openDoc(doc){ state.drawer = {kind:'doc', doc}; renderDrawer(); }

function wizardStep2(){

function wizardStep3(){

  <div class="genbox">

      <li>docs/需求调研.md（已按你填的内容写好）</li>

function renderWizard(){
  const host = document.getElementById('wizard');
  if(!wizard.open){ host.classList.remove('on'); return; }
  host.classList.add('on');
  document.getElementById('wiz-kicker').textContent = `新建项目 · ${wizard.step}/3`;
  document.getElementById('wiz-title').textContent = WIZ_TITLES[wizard.step-1];
  document.getElementById('wiz-steps').innerHTML = WIZ_STEPS.map((label,i)=>{
    const n = i + 1;
    const cls = n===wizard.step ? 'on' : n<wizard.step ? 'done' : '';
    return `<div class="wstep ${cls}"><i>${n<wizard.step?'✓':n}</i>${label}</div>${n<3?'<div class="wline"></div>':''}`;
  }).join('');
  document.getElementById('wiz-body').innerHTML = [wizardStep1, wizardStep2, wizardStep3][wizard.step-1]();
  document.getElementById('wiz-prev').disabled = wizard.step===1;
  document.getElementById('wiz-next').textContent = wizard.step===3 ? '创建并开始' : '下一步';
}
function wizValidate(){
  const d = wizard.data;
  if(wizard.step===1){
    if(!d.name.trim()) return '先填项目名';
    if(!d.dir.trim()) return '先选项目目录';
  }
  if(wizard.step===2){
    if(!d.user.trim()) return '先写「给谁用」';
    if(!d.problem.trim()) return '先写「最麻烦的一件事」';
  }
  if(wizard.step===3 && !d.coreTask.trim()) return '先写「第一版核心任务」';
  return '';
}
function createWizardProject(){
  saveWizardFields();
  const d = wizard.data;
  closeWizard();
  toast(`已创建「${d.name.trim()}」：需求调研已填，正在派发「生成需求池」（示意）`);
}

function renderAll(){ renderList(); renderDetail(); renderDrawer(); updateScenarioButtons(); }

document.addEventListener('click', (e)=>{
  const el = e.target.closest('[data-action]');
  if(!el) return;
  const a = el.dataset;
  switch(a.action){
    case 'scenario': setScenario(a.scenario); break;
    case 'theme':
      state.theme = state.theme==='light' ? 'dark' : 'light';
      document.documentElement.dataset.theme = state.theme;
      updateThemeButton();
      break;
    case 'select': {
      const proj = projectById(a.id);
      state.selected = a.id;
      if(proj && proj.archived) state.filter = 'archived';
      else if(state.filter==='archived') state.filter = 'all';
      state.scenario = (a.id==='catalk' && state.scenario==='stale') ? 'stale' : (a.id==='gds' && state.scenario==='dead') ? 'dead' : 'normal';
      state.drawer = null;
      renderAll();
      break;
    }
    case 'filter':
      state.filter = a.filter;
      renderList();
      break;
    case 'open-artifact': openArtifact(a.id, a.key); break;
    case 'open-doc': openDoc(a.doc); break;
    case 'tab':
      if(state.drawer){ state.drawer.tab = a.tab; renderDrawer(); }
      break;
    case 'close-drawer':
      state.drawer = null; renderDrawer(); break;
    case 'wiz-open': openWizard(1); break;
    case 'wiz-close': closeWizard(); break;
    case 'wiz-kind':
      saveWizardFields();
      wizard.data.kind = a.kind;
      renderWizard();
      break;
    case 'wiz-prev':
      saveWizardFields();
      if(wizard.step > 1){ wizard.step--; renderWizard(); }
      break;
    case 'wiz-next': {
      saveWizardFields();
      const err = wizValidate();
      if(err){ toast(err); break; }
      if(wizard.step < 3){ wizard.step++; renderWizard(); }
      else createWizardProject();
      break;
    }
    case 'toast': toast(a.msg || ''); break;
  }
});

document.getElementById('q').addEventListener('input', (e)=>{
  state.q = e.target.value;
  renderList();
});

document.addEventListener('input', (e)=>{
  const el = e.target.closest('[data-wiz]');
  if(el) wizard.data[el.dataset.wiz] = el.value;
});

document.addEventListener('keydown', (e)=>{
  if(e.key!=='Escape') return;
  if(wizard.open){ closeWizard(); return; }
  if(state.drawer){ state.drawer=null; renderDrawer(); }
});

function escAttr(s){ return String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;'); }

    tag:'<path d="M3 3h8l9 9-8 8-9-9z"/><circle cx="8" cy="8" r="1.2"/>',
    plus:'<path d="M12 5v14M5 12h14"/>',
    clock:'<circle cx="12" cy="12" r="8.5"/><path d="M12 7v5l3 2"/>'
  }[name] || '';
  return `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`;
}

/* 深链：?scenario=dead&open=demand&doc=publish&theme=dark */
(function(){
  const q = new URLSearchParams(location.search);
  if(q.get('theme')==='dark'){
    state.theme='dark'; document.documentElement.dataset.theme='dark'; updateThemeButton();
  }
  if(q.get('scenario')) setScenario(q.get('scenario'));
  if(q.get('project') && projectById(q.get('project'))){
    const pp = projectById(q.get('project'));
    state.selected = pp.id;
    state.scenario = 'normal';
    state.filter = pp.archived ? 'archived' : 'all';
    renderAll();
  }
  const w = Number(q.get('wizard'));
  if(w >= 1 && w <= 3){
    if(q.get('demo')==='1'){
      Object.assign(wizard.data, {
        name:'expense-log', kind:'App', dir:'E:\\WORK\\projects\\expense-log',
        user:'30 岁、一个月出差 2–3 次、习惯先攒票据的销售',
        background:'出差回来一堆纸质票和微信支付记录，月底才集中报；路上不方便开电脑',
        problem:'月底整理票据时，想不起某笔打车是见哪个客户；发票和聊天记录对不上',
        workaround:'相册 + 微信收藏 + Excel',
        goal:'当场拍一张、记一句，月底能按客户和日期找回来',
        coreTask:'记下这一笔支出和对应客户，月底能一次导出',
        notDoing:'不做审批流\n不做发票验真\n不做多设备同步'
      });
    }
    openWizard(w);
  }
  if(q.get('open')) openArtifact(state.selected || 'pbsk', q.get('open'));
  if(q.get('tab') && state.drawer){ state.drawer.tab=q.get('tab'); renderDrawer(); }
  if(q.get('doc')) openDoc(q.get('doc'));
})();
